[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-compress-x"
version = "0.1.0"
description = "Context-Aware Radix Prefix KV-Cache Compressor & Adaptive FP8/INT4 Quantization Engine for Long-Context LLM Serving (vLLM / SGLang)"
authors = [
    { name = "Ahmed Hassan", email = "ahmed.alaa.hassan25@gmail.com" }
]
license = { text = "MIT OR Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "typing_extensions>=4.8.0",
]
